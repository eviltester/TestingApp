<!doctype html>
<html>
<head>
    <title>configurable Automatic Dynamic Buttons</title>
    <link rel="stylesheet" href="/css/testpages.css">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/styled/css/dynamic-buttons.css">
    <script defer data-domain="testpages.eviltester.com" src="https://plausible.io/js/script.js"></script>

    <!-- HEAD -->

</head>

<body>

<div class="page-body">


    <div class="navigation">
        <div class="page-navigation">
            <a href="index.html">Index</a>
        </div>
        <div class="app-navigation">
            <a>Page</a>
            <a href="page?app=dynamicbuttonsauto&t=About">About</a>
        </div>
    </div>

    <h1>Configurable Automatic Dynamic Buttons</h1>

    <div class="explanation">
        <p>This page has a button that will be replaced by a new button automatically after a delay.
        </p>
    </div>

    <div class="centered">

        <p id="buttonmessage">Click the button.</p>
        <p>
            <label for="millis">Milliseconds between button refresh:</label>
            <input id="millis" type="number" name="change-time-millis" value="2000" size="6"/>
        </p>

        <div id="buttons">
            <button id="button0" data-id="0" name="clickable-button">Button</button>
        </div>
    </div>

    <div>
        <ul id="click-messages">
        </ul>
    </div>


    <div class="page-footer">
        <p><a target="_blank" rel="noopener noreferrer" href="https://eviltester.com">EvilTester.com</a>,
            <a target="_blank" rel="noopener noreferrer" href="https://compendiumdev.co.uk">Compendium Developments</a></p>
    </div>

</div>

<!-- BODY END -->

<script>

    var nextTimeout;
    var millisChange=2000;
    var showIdInButton=false;

    window.onload = function() {

        function handleMillisInputChange(event){
            var millisFromInput = parseInt(event.target.value,10);

            if(isNaN(millisFromInput)){
                return;
            }
            if(millisFromInput<=0){
                return;
            }
            if(millisChange != millisFromInput){
                clearTimeout(nextTimeout);
                millisChange = millisFromInput;
                var currentButtonId = document.getElementsByName("clickable-button")[0].getAttribute("data-id");
                nextTimeout = setTimeout(replaceButton, millisChange, ++currentButtonId);
            }
        }


        function createButton(anId, text, where) {
            var button = document.createElement("button");
            button.innerHTML = text;
            button.setAttribute("id", "button" + anId);
            button.setAttribute("data-id", anId);
            button.setAttribute("name", "clickable-button");
            var body = document.getElementById(where);
            body.appendChild(button);

            return button;
        }

        function addClickMessage(id){
            const messagesul = document.getElementById("click-messages");
            var li = document.createElement("li");
            li.setAttribute("data-buttonid","button" + id);
            li.innerHTML = "Clicked Button " + id;
            messagesul.prepend(li);
        }

        function replaceButton(nextId){
            // delete button
            document.getElementById("buttons").innerHTML = "";
            fullyCreateButton(nextId)
        }

        function fullyCreateButton(id){
            var buttonText = "Button";
            if(showIdInButton){
                buttonText += ` ${id}`
            }
            button = createButton(id, buttonText, "buttons");
            button.onclick = function () {
                addClickMessage(id);
            }
            nextTimeout = setTimeout(replaceButton,millisChange, ++id);
        }

        document.getElementById("millis").addEventListener("input",handleMillisInputChange);
        replaceButton(0);

    }

</script>
</body>
</html>
